stages:
  - deploy

deploy_to_rumahweb:
  stage: deploy
  image: ubuntu:latest
  only:
    - main
  before_script:
    - apt-get update -qy
    - apt-get install -y lftp
  script:
    - lftp -e "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASS $FTP_HOST; mirror -R --delete --exclude .git/ --exclude .gitlab-ci.yml --exclude .env --exclude vendor/ --exclude storage/ --exclude bootstrap/cache/ --exclude public/ ./ /furni_app; quit"
    - lftp -e "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASS $FTP_HOST; mirror -R --delete --exclude index.php --exclude storage/ ./public /public_html/store.cungporto.my.id/public; quit"
